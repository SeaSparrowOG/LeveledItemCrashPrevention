; Do not edit this INI directly. This plugin supports a "custom" INI to overwrite settings.
; The purpose of the default INI is for the author to more easily test/change things.
; Usave of the custom INI is intended for advanced users that want to safely modify settings.

; How to use the custom INI:
;	1. Copy this file.
;	2. Rename the copy to be the same, but with "_Custom" at the end.
;		For example, TestProject.ini becomes TestProject_Custom.ini 
;	3. Change any settings you want in the new file. This preservers compatibility with
;			future updates that may invalidate certain settings. 


[General]
bWarn = 1                     ;Displays an in-game message box if an issue is found and fixed.
bSanitize = 1                 ;When the game first loads, tries to find invalid leveled lists and warns you. 
bDynamicCircularListGuard = 1 ;Prevents accidental circular leveled lists due to AddForm.

;Checks for circular leveled lists that already exist both at startup and every time a save is loaded.
;In addition to checking for circular leveled lists within plugins in the same way xEdit does, this also
;checks every time a save is loaded to see if there are any circular lists within the save's modified
;lists that were created prior to installing Leveled List Crash Prevention.
;These lists, however, will NOT be fixed. Doing so requires understanding intent, which is impossible to 
;programmatically determine.
bCheckForExistingCircular = 0 